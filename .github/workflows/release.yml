name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test

      # Version comes from the tag; the update checker compares it against the latest release
      - name: Publish
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish usb-headset-tray.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            "-p:Version=$version" `
            -o publish

      - name: Download HeadsetControl
        run: >
          Invoke-WebRequest
          -Uri "https://github.com/Sapd/HeadsetControl/releases/latest/download/headsetcontrol-windows-x86_64.exe"
          -OutFile "publish\headsetcontrol.exe"

      - name: Package zip
        run: >
          Compress-Archive
          -Path "publish\UsbHeadsetTray.exe", "publish\headsetcontrol.exe"
          -DestinationPath "publish\usb-headset-tray.zip"

      - name: Build installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /DAppVersion=$version installer.iss

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/usb-headset-tray.zip
            publish/usb-headset-tray-setup.exe
          generate_release_notes: true
